<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vouch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vouch</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s ease-in-out;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }
    .logo-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      animation: pulse 2s infinite ease-in-out;
    }
    .flickr-loader {
      position: relative;
      width: 60px;
      height: 20px;
      margin-top: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .flickr-ball {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      animation: flickr-orbit 1.6s infinite ease-in-out;
    }
    .flickr-blue {
      background-color: #003DA5; /* Royal Blue */
      animation-delay: 0s;
    }
    .flickr-gold {
      background-color: #FFC107; /* Gold */
      animation-delay: -0.8s; /* 180 degrees out of phase */
    }
    .splash-footer {
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .footer-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 500;
    }
    .footer-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .first-name {
      color: #FFC107; /* Gold */
    }
    .last-name {
      color: #003DA5; /* Royal Blue */
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }
    @keyframes flickr-orbit {
      0%, 100% {
        transform: translateX(-16px) scale(1);
        z-index: 2;
      }
      25% {
        transform: translateX(0px) scale(1.25);
        z-index: 2;
      }
      50% {
        transform: translateX(16px) scale(1);
        z-index: 1;
      }
      75% {
        transform: translateX(0px) scale(0.75);
        z-index: 1;
      }
    }
  </style>
</head>
<body>
  <div id="splash-container">
    <div class="splash-content">
      <!-- Standard Flutter asset path is assets/assets/logos/vouch.webp, fallback handles debug/release differences -->
      <img src="assets/assets/logos/vouch.webp" onerror="this.onerror=null; this.src='assets/logos/vouch.webp';" class="logo-img" alt="Vouch Logo">
      <div class="flickr-loader">
        <div class="flickr-ball flickr-blue"></div>
        <div class="flickr-ball flickr-gold"></div>
      </div>
    </div>
    <div class="splash-footer">
      <div class="footer-label">Created By</div>
      <div class="footer-name">
        <span class="first-name">Vouch</span> <span class="last-name">SoftTech Services</span>
      </div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
