<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vouch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vouch</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      overflow: hidden;
    }
    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s ease-in-out;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }
    .logo-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      animation: pulse 2s infinite ease-in-out;
    }
    .spinner {
      margin-top: 28px;
      width: 26px;
      height: 26px;
      border: 3px solid #f1f5f9;
      border-top-color: #003DA5; /* Royal Blue */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .splash-footer {
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .footer-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 500;
    }
    .footer-name {
      font-size: 14px;
      color: #0f172a;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="splash-container">
    <div class="splash-content">
      <!-- Standard Flutter asset path is assets/assets/logos/vouch.png, fallback handles debug/release differences -->
      <img src="assets/assets/logos/vouch.png" onerror="this.onerror=null; this.src='assets/logos/vouch.png';" class="logo-img" alt="Vouch Logo">
      <div class="spinner"></div>
    </div>
    <div class="splash-footer">
      <div class="footer-label">Created By</div>
      <div class="footer-name">Jeslito G. Geverola</div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
