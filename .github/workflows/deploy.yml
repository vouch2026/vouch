name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          touch .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SUPABASE_ID_BUCKET=${{ secrets.SUPABASE_ID_BUCKET }}" >> .env
          echo "SUPABASE_ORG_BUCKET=${{ secrets.SUPABASE_ORG_BUCKET }}" >> .env
          echo "SUPABASE_ANNOUNCEMENTS_BUCKET=${{ secrets.SUPABASE_ANNOUNCEMENTS_BUCKET }}" >> .env
          echo "SUPABASE_EVENT_BUCKET=${{ secrets.SUPABASE_EVENT_BUCKET }}" >> .env
          echo "SUPABASE_RECEIPTS_BUCKET=${{ secrets.SUPABASE_RECEIPTS_BUCKET }}" >> .env
          echo "SUPABASE_HIGHLIGHTS_BUCKET=${{ secrets.SUPABASE_HIGHLIGHTS_BUCKET }}" >> .env
          echo "SUPABASE_EXCUSE_BUCKET=${{ secrets.SUPABASE_EXCUSE_BUCKET }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release --no-source-maps

      - name: Copy vercel.json to build/web
        run: cp vercel.json build/web/

      # If pushing to main branch, deploy to production environment
      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./build/web

      # If pushing to development branch, deploy to preview environment
      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./build/web
