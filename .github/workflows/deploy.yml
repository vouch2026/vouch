name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java (required for some Flutter tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          touch .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SUPABASE_ID_BUCKET=${{ secrets.SUPABASE_ID_BUCKET }}" >> .env
          echo "SUPABASE_ORG_BUCKET=${{ secrets.SUPABASE_ORG_BUCKET }}" >> .env
          echo "SUPABASE_ANNOUNCEMENTS_BUCKET=${{ secrets.SUPABASE_ANNOUNCEMENTS_BUCKET }}" >> .env
          echo "SUPABASE_EVENT_BUCKET=${{ secrets.SUPABASE_EVENT_BUCKET || secrets.SUPABASE_EVENTS_BUCKET }}" >> .env
          echo "SUPABASE_EVENTS_BUCKET=${{ secrets.SUPABASE_EVENTS_BUCKET || secrets.SUPABASE_EVENT_BUCKET }}" >> .env
          echo "SUPABASE_RECEIPTS_BUCKET=${{ secrets.SUPABASE_RECEIPTS_BUCKET }}" >> .env
          echo "SUPABASE_HIGHLIGHTS_BUCKET=${{ secrets.SUPABASE_HIGHLIGHTS_BUCKET }}" >> .env
          echo "SUPABASE_EXCUSE_BUCKET=${{ secrets.SUPABASE_EXCUSE_BUCKET }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release --no-source-maps

      - name: Create Cloudflare _headers file for WebAssembly/Routing
        run: |
          echo "/*" > build/web/_headers
          echo "  Cross-Origin-Embedder-Policy: require-corp" >> build/web/_headers
          echo "  Cross-Origin-Opener-Policy: same-origin" >> build/web/_headers

      - name: Deploy to Cloudflare via CLI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --compatibility-date=2026-08-04
